<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administrator layout regression fixture</title></head>
<body><div id="root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { Site } from '/src/client/App.tsx';
import { aiSettingsSchema } from '/src/shared/ai.ts';
import '/src/client/styles.css';
import '/src/client/AdminConsole.css';
import '/src/client/Download.css';

// Synthetic data only. No API request or write can reach the Worker.
const mode = new URLSearchParams(location.search).get('mode') || 'admin';
const long = 'SyntheticLongIdentifier'.repeat(6);
const user = { id: 'layout-user', username: long.slice(0, 30), role: 'admin', group_id: 'layout-group', is_elderly: 0 };
const family = { id: user.group_id, name: long.slice(0, 60), timezone: 'Asia/Shanghai',
  join_code: 'SYNTHETIC-LAYOUT-ONLY', meal_times: '{"morning":"08:00","noon":"12:00","evening":"18:00"}' };
const data = {
  api_version: 1, user, binding_only: mode === 'binding', group_id: mode === 'empty' ? null : family.id,
  groups: mode === 'empty' ? [] : [family], users: [user], members: [user],
  warehouses: mode === 'empty' ? [] : [{ id: 'layout-warehouse', name: long, group_id: family.id }],
  security: { remaining: 10, totp: true, passkeys: 0 },
  passkey_admins: [{ id: user.id, username: user.username, totp: true, passkeys: [] }],
  ai: { settings: aiSettingsSchema.parse({}), has_llm_key: false, has_tavily_key: false },
  download: { android_apk_url: '' },
};
const originalFetch = window.fetch.bind(window);
window.fetch = async (input, init = {}) => {
  const url = new URL(input instanceof Request ? input.url : String(input), location.href);
  if (!url.pathname.startsWith('/api/')) return originalFetch(input, init);
  if ((init.method || (input instanceof Request ? input.method : 'GET')) !== 'GET')
    throw new Error('Writes are disabled in layout tests.');
  if (url.pathname === '/api/admin/bootstrap') return mode === 'login'
    ? Response.json({ error: 'Synthetic signed-out state' }, { status: 401 }) : Response.json(data);
  if (url.pathname === '/api/download' || url.pathname === '/api/admin/download') return Response.json(data.download);
  throw new Error(`Missing synthetic reply: ${url.pathname}`);
};
createRoot(document.getElementById('root')).render(React.createElement(Site, { pathname: mode === 'download' ? '/download' : '/' }));

const settle = () => new Promise(resolve => setTimeout(resolve, 25));
const waitFor = async (doc, selector) => {
  const until = Date.now() + 5000;
  while (!doc.querySelector(selector)) {
    if (Date.now() > until) throw new Error(`Timed out waiting for ${selector}`);
    await settle();
  }
  await settle();
};
window.runResponsiveChecks = async (widths = [320, 360, 390, 600, 768, 800, 820, 1024, 1440]) => {
  const results = [];
  for (const mode of ['admin', 'login', 'binding', 'empty', 'download']) for (const width of widths) {
    const frame = document.createElement('iframe');
    frame.title = `${mode} layout at ${width}px`;
    frame.style.cssText = `position:fixed;left:0;top:0;width:${width}px;height:844px;border:0;opacity:0;pointer-events:none`;
    frame.src = `${location.pathname}?mode=${mode}`;
    document.body.append(frame);
    try {
      await new Promise((resolve, reject) => { frame.onload = resolve; frame.onerror = reject; });
      const doc = frame.contentDocument, view = frame.contentWindow;
      await waitFor(doc, mode === 'login' ? '.login-form' : mode === 'binding' ? '.binding-page .panel'
        : mode === 'download' ? '.download-card button:disabled' : '.admin-workspace .panel');
      const measure = page => {
        const viewport = doc.documentElement.clientWidth, dialog = doc.querySelector('dialog[open]');
        const overflow = [...doc.querySelectorAll('body *')].flatMap(el => {
          if (el.matches('.skip-link') || el.closest('dialog:not([open])')) return [];
          const rect = el.getBoundingClientRect();
          return rect.width && (rect.right > viewport + 1 || rect.left < -1) ? [el.className || el.tagName] : [];
        });
        const twoColumnFormOnPhone = width <= 600 && [...doc.querySelectorAll('.form-row')].some(el =>
          el.getBoundingClientRect().width && view.getComputedStyle(el).gridTemplateColumns.split(' ').length > 1);
        results.push({ mode, width, page, viewport, scrollWidth: doc.documentElement.scrollWidth,
          twoColumnFormOnPhone, overflow: overflow.slice(0, 8),
          dialogOverflow: dialog ? dialog.scrollWidth > dialog.clientWidth + 1 : false });
      };
      measure(mode === 'admin' || mode === 'empty' ? 'account' : mode);
      if (!['admin', 'empty'].includes(mode)) continue;
      const clickText = (selector, text) => {
        const button = [...doc.querySelectorAll(selector)].find(el => el.textContent.trim() === text);
        if (!button) throw new Error(`Missing button: ${text}`);
        button.click();
      };
      const nav = doc.querySelectorAll('.admin-sidebar nav button');
      nav[1].click(); await waitFor(doc, '.admin-columns'); measure('family');
      if (mode === 'empty') continue;
      clickText('.management-row button', '编辑设置');
      await waitFor(doc, 'dialog[open] input'); measure('group-editor');
      doc.querySelector('dialog[open] .modal-heading button').click(); await settle();
      clickText('.management-row button', '显示分组码二维码');
      await waitFor(doc, 'dialog[open] .group-join-qr svg'); measure('group-qr');
      doc.querySelector('dialog[open] .modal-heading button').click(); await settle();
      nav[2].click(); await waitFor(doc, '.panel textarea'); measure('ai-settings');
      nav[3].click(); await waitFor(doc, '.panel input[type=url]'); measure('download-settings');
    } finally { frame.remove(); }
  }
  window.responsiveResults = results;
  return { cases: results.length, failures: results.filter(r =>
    r.scrollWidth > r.viewport + 1 || r.overflow.length || r.dialogOverflow || r.twoColumnFormOnPhone) };
};
</script></body></html>
